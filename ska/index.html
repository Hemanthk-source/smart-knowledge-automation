<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Knowledge Automation</title>
<style>
:root{--bg:#f3f6f7;--surface:#fff;--ink:#17262b;--muted:#5d6f75;--line:#d5dee1;--accent:#0f6b6b;--mark:#ffe08a;--tag:#e0eeee}
@media (prefers-color-scheme:dark){:root{--bg:#10181b;--surface:#18242a;--ink:#e6eef0;--muted:#92a6ad;--line:#2b3b42;--accent:#5fc2bd;--mark:#6b5a1c;--tag:#21383b}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink)}
button,input,textarea{font:inherit;color:inherit}
header{padding:28px 24px 8px;max-width:1100px;margin:auto}
h1{margin:0;font-size:1.7rem;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--muted)}
main{max-width:1100px;margin:auto;padding:16px 24px 48px;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px}
@media(max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
h2{margin:0 0 12px;font-size:1.05rem}
input[type=text],textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);margin-bottom:10px}
textarea{min-height:150px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--bg);padding:8px 14px;border-radius:6px}
button.ghost{background:transparent;color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{background:var(--tag);color:var(--ink);border:0;border-radius:99px;padding:2px 10px;font-size:.82rem;cursor:pointer}
.tag.on{background:var(--accent);color:var(--bg)}
.note{border-top:1px solid var(--line);padding:14px 0}
.note:first-of-type{border-top:0}
.note h3{margin:0;font-size:1.05rem}
.summary{margin:6px 0;color:var(--ink)}
.meta{color:var(--muted);font-size:.85rem}
mark{background:var(--mark);color:inherit;padding:0 2px}
.related{font-size:.85rem;color:var(--muted)}
.related a{color:var(--accent);cursor:pointer;text-decoration:underline}
.stats{color:var(--muted);font-size:.9rem;margin-bottom:8px}
.empty{color:var(--muted);padding:24px 0;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Smart Knowledge Automation</h1>
  <p>Add notes or text files. Summaries, keywords and related notes are generated automatically.</p>
</header>
<main>
  <section aria-label="Add knowledge">
    <h2>Add knowledge</h2>
    <input type="text" id="title" placeholder="Title (optional, auto-generated if empty)">
    <textarea id="body" placeholder="Paste text, meeting notes, an article…"></textarea>
    <div class="row">
      <button id="add">Add note</button>
      <button class="ghost" id="import">Import .txt / .md</button>
      <input type="file" id="file" accept=".txt,.md" multiple hidden>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="ghost" id="export">Export JSON</button>
      <button class="ghost" id="clear">Clear all</button>
    </div>
  </section>

  <section aria-label="Knowledge base">
    <h2>Knowledge base</h2>
    <input type="text" id="q" placeholder="Search by meaning of words, e.g. “keyword ranking”" aria-label="Search">
    <div class="tags" id="tagbar"></div>
    <div class="stats" id="stats"></div>
    <div id="list"></div>
  </section>
</main>

<script>
/* ---------- NLP helpers (no external libraries) ---------- */
const STOP = new Set("a an the and or but if then else of to in on at by for with from as is are was were be been being it its this that these those i you he she we they them his her our your their not no so do does did done have has had will would can could should may might must about into over under than too very just also more most such there here what which who whom when where why how all any each few other some own same only out up down off again further once".split(" "));

const tokenize = t => (t.toLowerCase().match(/[a-z0-9][a-z0-9'-]{1,}/g) || []).filter(w => !STOP.has(w));
const sentences = t => (t.replace(/\s+/g, " ").match(/[^.!?]+[.!?]*/g) || []).map(s => s.trim()).filter(s => s.length > 20);

function termFreq(tokens){ const f = {}; tokens.forEach(w => f[w] = (f[w] || 0) + 1); return f; }

/* ---------- Storage ---------- */
let notes = [];
const KEY = "ska.notes.v1";
function load(){
  try { notes = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ notes = []; }
  if (!notes.length) seed();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch(e){} }

/* ---------- Automation: summary, keywords, tags ---------- */
function analyze(note){
  const tokens = tokenize(note.title + " " + note.body);
  note.tf = termFreq(tokens);
  note.len = tokens.length || 1;
}
function idf(){
  const df = {}, N = notes.length || 1;
  notes.forEach(n => Object.keys(n.tf).forEach(w => df[w] = (df[w] || 0) + 1));
  const out = {}; Object.keys(df).forEach(w => out[w] = Math.log(1 + N / df[w]));
  return out;
}
function keywords(note, IDF, k = 5){
  return Object.entries(note.tf)
    .map(([w, c]) => [w, (c / note.len) * (IDF[w] || 1)])
    .sort((a, b) => b[1] - a[1]).slice(0, k).map(x => x[0]);
}
function summarize(note, n = 2){
  const sents = sentences(note.body);
  if (sents.length <= n) return sents.join(" ") || note.body.slice(0, 160);
  const f = termFreq(tokenize(note.body));
  const scored = sents.map((s, i) => {
    const toks = tokenize(s);
    const score = toks.reduce((a, w) => a + f[w], 0) / (toks.length || 1) + (i === 0 ? 0.5 : 0);
    return { s, i, score };
  });
  return scored.sort((a, b) => b.score - a.score).slice(0, n)
    .sort((a, b) => a.i - b.i).map(x => x.s).join(" ");
}
function autoTitle(body){ const s = sentences(body)[0] || body; return s.split(" ").slice(0, 8).join(" ").replace(/[.!?]+$/, ""); }

function refresh(){
  notes.forEach(analyze);
  const IDF = idf();
  notes.forEach(n => { n.keys = keywords(n, IDF); n.summary = summarize(n); });
  save();
}

/* ---------- Search (TF-IDF scoring) and related notes ---------- */
function search(query){
  const qt = tokenize(query);
  if (!qt.length) return notes.map(n => ({ n, score: 0 }));
  const IDF = idf();
  return notes.map(n => {
    let score = 0;
    qt.forEach(w => {
      Object.keys(n.tf).forEach(t => { if (t === w) score += (n.tf[t] / n.len) * (IDF[t] || 1) * 10;
                                       else if (t.startsWith(w) && w.length > 2) score += (n.tf[t] / n.len) * 3; });
      if (n.title.toLowerCase().includes(w)) score += 1;
    });
    return { n, score };
  }).filter(r => r.score > 0).sort((a, b) => b.score - a.score);
}
function related(note, k = 3){
  const IDF = idf();
  const vec = n => { const v = {}; Object.keys(n.tf).forEach(w => v[w] = (n.tf[w] / n.len) * (IDF[w] || 1)); return v; };
  const a = vec(note), na = Math.sqrt(Object.values(a).reduce((s, x) => s + x * x, 0)) || 1;
  return notes.filter(n => n.id !== note.id).map(n => {
    const b = vec(n); let dot = 0;
    for (const w in a) if (b[w]) dot += a[w] * b[w];
    const nb = Math.sqrt(Object.values(b).reduce((s, x) => s + x * x, 0)) || 1;
    return { n, sim: dot / (na * nb) };
  }).filter(r => r.sim > 0.05).sort((x, y) => y.sim - x.sim).slice(0, k);
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
let activeTag = null;
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function highlight(text, query){
  let html = esc(text);
  tokenize(query).forEach(w => { html = html.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>"); });
  return html;
}

function render(){
  const q = $("q").value.trim();
  let results = search(q);
  if (activeTag) results = results.filter(r => r.n.keys.includes(activeTag));

  const allTags = {};
  notes.forEach(n => n.keys.forEach(k => allTags[k] = (allTags[k] || 0) + 1));
  $("tagbar").innerHTML = Object.entries(allTags).sort((a, b) => b[1] - a[1]).slice(0, 14)
    .map(([t, c]) => `<button class="tag ${t === activeTag ? "on" : ""}" data-tag="${esc(t)}">${esc(t)} (${c})</button>`).join("");

  $("stats").textContent = `${results.length} of ${notes.length} notes` + (q ? ` matching “${q}”` : "");
  if (!results.length){ $("list").innerHTML = `<div class="empty">No notes found. Add one on the left, or clear the search.</div>`; return; }

  $("list").innerHTML = results.map(({ n }) => {
    const rel = related(n).map(r => `<a data-id="${r.n.id}">${esc(r.n.title)}</a>`).join(", ");
    return `<article class="note">
      <h3>${highlight(n.title, q)}</h3>
      <div class="meta">${new Date(n.created).toLocaleDateString()} · ${n.len} words</div>
      <p class="summary">${highlight(n.summary, q)}</p>
      <div class="tags">${n.keys.map(k => `<button class="tag" data-tag="${esc(k)}">${esc(k)}</button>`).join("")}</div>
      ${rel ? `<div class="related">Related: ${rel}</div>` : ""}
      <button class="ghost" data-del="${n.id}">Delete</button>
    </article>`;
  }).join("");
}

function addNote(title, body){
  body = body.trim(); if (!body) return;
  notes.unshift({ id: Date.now() + Math.random().toString(36).slice(2, 6), title: title.trim() || autoTitle(body), body, created: Date.now() });
  refresh(); render();
}

$("add").onclick = () => { addNote($("title").value, $("body").value); $("title").value = ""; $("body").value = ""; };
$("q").oninput = render;
$("import").onclick = () => $("file").click();
$("file").onchange = async e => {
  for (const f of e.target.files) addNote(f.name.replace(/\.\w+$/, ""), await f.text());
  e.target.value = "";
};
$("export").onclick = () => {
  const blob = new Blob([JSON.stringify(notes.map(({ id, title, body, summary, keys, created }) => ({ id, title, body, summary, keys, created })), null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "knowledge-base.json"; a.click();
};
$("clear").onclick = () => { if (confirm("Delete all notes?")){ notes = []; save(); render(); } };
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tag]"); if (t){ activeTag = activeTag === t.dataset.tag ? null : t.dataset.tag; render(); }
  const d = e.target.closest("[data-del]"); if (d){ notes = notes.filter(n => n.id !== d.dataset.del); refresh(); render(); }
  const r = e.target.closest("[data-id]"); if (r){ $("q").value = notes.find(n => n.id === r.dataset.id).title; render(); }
});

/* ---------- Sample data ---------- */
function seed(){
  const s = [
    ["Onboarding checklist", "New employees receive laptop access on day one. The IT team creates email accounts and grants access to the knowledge base. Managers schedule a welcome meeting during the first week."],
    ["Support ticket workflow", "Every support ticket is triaged by priority within one hour. High priority tickets are escalated to the on-call engineer. Resolved tickets are documented in the knowledge base so future agents can reuse the solution."],
    ["Search ranking basics", "Keyword search ranks documents by term frequency and inverse document frequency. Rare words carry more weight than common words. Ranking improves when documents are cleaned and stop words are removed."],
    ["Meeting notes automation", "Meeting transcripts can be summarized automatically by scoring each sentence on keyword frequency. The top sentences form a short summary that is stored with the meeting notes for quick search."]
  ];
  notes = s.reverse().map(([title, body], i) => ({ id: "seed" + i, title, body, created: Date.now() - i * 864e5 }));
}

load(); refresh(); render();
</script>
</body>
</html>
